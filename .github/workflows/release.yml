name: Release

# On every push to main, publish a GitHub Release for BRAT if manifest.json's
# version (tag without "v" prefix) has no release yet. Bump the version to release.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and check for existing release
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" > /dev/null 2>&1; then
            echo "Release $version already exists, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 20
          cache: npm

      - if: steps.version.outputs.exists == 'false'
        run: npm ci

      - if: steps.version.outputs.exists == 'false'
        run: npm run build

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        run: |
          version="${{ steps.version.outputs.version }}"
          # Release notes: subject of the latest commit that changed manifest.json.
          notes=$(git log -1 --format=%s -- manifest.json)
          gh release create "$version" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" \
            --title "$version" \
            --notes "$notes"
